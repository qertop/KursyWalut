<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0ea5a4" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#0ea5a4"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Tło karty ilustracyjnej -->
  <rect x="10" y="10" width="500" height="300" rx="16" fill="url(#g1)" stroke="#dce3ee" stroke-width="1.5"/>

  <!-- Linie siatki -->
  <line x1="40" y1="80" x2="480" y2="80" stroke="#dce3ee" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="40" y1="140" x2="480" y2="140" stroke="#dce3ee" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="40" y1="200" x2="480" y2="200" stroke="#dce3ee" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="40" y1="260" x2="480" y2="260" stroke="#dce3ee" stroke-width="1.5"/>

  <!-- Wykres krzywej kursowej -->
  <path d="M50 220 C 110 200, 150 240, 210 160 C 270 90, 330 180, 390 120 C 430 80, 460 100, 470 95" 
        stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Punkty danych -->
  <circle cx="210" cy="160" r="5" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="390" cy="120" r="5" fill="#0ea5a4" stroke="#ffffff" stroke-width="2"/>
  <circle cx="470" cy="95" r="6" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>

  <!-- Monety / kółka walutowe -->
  <g transform="translate(60, 45)">
    <circle cx="20" cy="20" r="18" fill="#1d4ed8"/>
    <text x="20" y="26" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">€</text>
  </g>
  <g transform="translate(130, 30)">
    <circle cx="20" cy="20" r="18" fill="#0ea5a4"/>
    <text x="20" y="26" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">$</text>
  </g>
  <g transform="translate(200, 45)">
    <circle cx="20" cy="20" r="18" fill="#16a34a"/>
    <text x="20" y="26" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">zł</text>
  </g>

  <!-- Karta badge z kursem -->
  <rect x="330" y="35" width="140" height="42" rx="8" fill="#ffffff" stroke="#dce3ee" stroke-width="1"/>
  <text x="342" y="54" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#14213b">EUR / PLN</text>
  <text x="342" y="69" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#15803d">4.2415 zł  +0.2%</text>
</svg>
